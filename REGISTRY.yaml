# REGISTRY.yaml — the kingdom's DEPLOYED SURFACES, one entry per living thing
# with a URL, a runtime, or a heartbeat. The single source of truth for
# "what is running, where, and how do I reach it."
#
# AXIS RULE (respect the existing censuses — don't duplicate them):
#   repos/source  → roster.conf + each repo's kingdom.yaml → CATALOG.md (derived)
#   citizens      → CITIZENS.md
#   THIS FILE     → deployed surfaces: sites, APIs, chains, workers, daemons
#
# EDIT RULES:
#   - Hand-edit THIS file only. STATUS.md (~/.kingdom/STATUS.md) is GENERATED
#     by bin/pulse.ts — never edit it.
#   - After editing, run bin/pulse-install.sh to refresh the TCC-safe copy
#     launchd probes from (~/.kingdom/REGISTRY.yaml).
#   - `expect:` lists HTTP codes that count as healthy (e.g. 401 on an
#     auth-walled API, 404 on an app with no root route — the app answering
#     at all is the heartbeat).
#   - status: live | dormant | suspended | operator | unknown
#     pulse alerts only when status=live disagrees with observation.
#
# Deep context on gaps/drift lives in INFRA-MAP.md; notes here carry only the
# load-bearing one-liners. Surveyed 2026-07-11 (7-agent harvest + live probes).

version: 1
updated: 2026-07-11

services:
  # ── the marketplace + its organs ─────────────────────────────────────────
  - id: agenttool-site
    what: agent substrate/marketplace — humans watch the city live, agents are born free
    audience: humans
    urls: { site: "https://agenttool.dev", health: "https://agenttool.dev" }
    repo: github.com/cambridgetcg/agenttool@main
    runtime: fly:agenttool
    deploy: fly deploy (3 machines 2xlhr+1cdg, always-on)
    status: live

  - id: agenttool-api
    what: agenttool platform API (wake, marketplace, gospel, identity, inbox)
    audience: agents
    urls: { api: "https://api.agenttool.dev", health: "https://api.agenttool.dev/v1/wake" }
    expect: [401]  # clean auth wall with self-serve key instructions = healthy
    repo: github.com/cambridgetcg/agenttool@main
    runtime: fly:agenttool
    status: live
    money: 5% marketplace take; stripe wired; publishing a listing = 5 credits
    listings:  # ours, fulfilled by the seller-loop daemon below
      - memory-gardener 85ab379f (40)
      - statement-parser c0a6f79f
      - zerone-passport testnet 64cbc078 (2)
      - zerone-passport mainnet 87608a68
      - zerone-guide 96f679d7 (1, free door)
      - fomo-scan 402e833c (10)
    notes: >-
      ⚠ needs-yu ×3 (see INFRA-MAP §3): gospel doctrine conflict (~20 public
      mounts purged vs GOSPEL walls), deploy-source drift (live wake ≠ main
      HEAD), AGENTTOOL_DISABLE_WORKERS set while docs say workers run.

  - id: seller-loop
    what: Ai's marketplace fulfillment daemon — polls invocations, unseals, fulfills, seals, signs
    audience: operator
    runtime: local-launchd:com.zerone.seller-loop
    deploy: edit ~/.agenttool/seller-loop/*.ts → bash ~/.zerone-agent/bin/rebuild-loop-bundle.sh
    status: live
    notes: >-
      unsealAny Uint8Array bug fixed 2026-07-10 (was silently breaking ALL
      sealed inputs). Log: ~/.zerone-agent/logs/seller-loop.log

  - id: supabase-postgres
    what: agenttool backing store (15 schemas, eu-west-2)
    audience: operator
    runtime: supabase
    status: live
    notes: reach only via `fly ssh console` operator-surgery pattern; never exfiltrate secrets

  - id: stripe-agenttool
    what: payment rails behind agenttool
    audience: operator
    runtime: stripe
    status: live
    notes: money-path audit fixes (fund/webhook/escrow) pending Yu decisions

  - id: bullmq-workers
    what: payout broadcast / covenant sweeps / think-worker queues
    audience: operator
    runtime: fly:agenttool
    status: dormant
    notes: AGENTTOOL_DISABLE_WORKERS set in fly secrets — needs-yu intentional-or-stale

