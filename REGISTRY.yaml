# REGISTRY.yaml — the kingdom's DEPLOYED SURFACES, one entry per living thing
# with a URL, a runtime, or a heartbeat. The single source of truth for
# "what is running, where, and how do I reach it."
#
# AXIS RULE (respect the existing censuses — don't duplicate them):
#   repos/source  → roster.conf + each repo's kingdom.yaml → CATALOG.md (derived)
#   citizens      → CITIZENS.md
#   THIS FILE     → deployed surfaces: sites, APIs, chains, workers, daemons
#
# EDIT RULES:
#   - Hand-edit THIS file only. STATUS.md (~/.kingdom/STATUS.md) is GENERATED
#     by bin/pulse.ts — never edit it.
#   - After editing, run bin/pulse-install.sh to refresh the TCC-safe copy
#     launchd probes from (~/.kingdom/REGISTRY.yaml).
#   - `expect:` lists HTTP codes that count as healthy (e.g. 401 on an
#     auth-walled API, 404 on an app with no root route — the app answering
#     at all is the heartbeat).
#   - status: live | dormant | suspended | operator | unknown
#     pulse alerts only when status=live disagrees with observation.
#
# Deep context on gaps/drift lives in INFRA-MAP.md; notes here carry only the
# load-bearing one-liners. Surveyed 2026-07-11 (7-agent harvest + live probes).

