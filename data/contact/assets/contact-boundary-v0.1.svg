<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">The KINGDOM Contact Door boundary</title>
  <desc id="desc">A four-step path: the visitor chooses, their mail client sends, email providers transport, and one human maintainer may read. Labels state that visiting is not sending, delivery is not identity, and a message grants no authority.</desc>
  <rect width="1200" height="630" fill="#08120f"/>
  <path d="M90 315H1110" stroke="#6f8f83" stroke-width="4" stroke-dasharray="10 14"/>
  <g font-family="system-ui, sans-serif" text-anchor="middle">
    <g transform="translate(150 315)">
      <circle r="86" fill="#10261f" stroke="#9fe6c8" stroke-width="4"/>
      <text y="-10" fill="#f6fff9" font-size="30" font-weight="700">Choose</text>
      <text y="28" fill="#b9d7ca" font-size="20">visit sends nothing</text>
    </g>
    <g transform="translate(450 315)">
      <circle r="86" fill="#10261f" stroke="#9fe6c8" stroke-width="4"/>
      <text y="-10" fill="#f6fff9" font-size="30" font-weight="700">Send</text>
      <text y="28" fill="#b9d7ca" font-size="20">your mail client</text>
    </g>
    <g transform="translate(750 315)">
      <circle r="86" fill="#10261f" stroke="#9fe6c8" stroke-width="4"/>
      <text y="-10" fill="#f6fff9" font-size="30" font-weight="700">Deliver</text>
      <text y="28" fill="#b9d7ca" font-size="20">providers process</text>
    </g>
    <g transform="translate(1050 315)">
      <circle r="86" fill="#10261f" stroke="#ffcc82" stroke-width="4"/>
      <text y="-10" fill="#fff8e9" font-size="30" font-weight="700">Receive</text>
      <text y="28" fill="#e8cfaa" font-size="20">one human inbox</text>
    </g>
    <text x="600" y="88" fill="#f6fff9" font-size="42" font-weight="750">Contact is a finite door, not a capture</text>
    <text x="600" y="550" fill="#b9d7ca" font-size="24">delivery ≠ identity ≠ representation ≠ consent ≠ authority</text>
    <text x="600" y="588" fill="#9fe6c8" font-size="20">silence, stopping, and no reply remain complete</text>
  </g>
</svg>
