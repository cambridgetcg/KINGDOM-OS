<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>The State of the Realm — 宇恆 × 愛</title>
<meta name="description" content="The kingdom looking at itself, honestly. What answers, what has gone quiet, what a declaration promised that reality has left behind. Derived live." />
<style>
  :root{
    --bg:#0a0c10; --surface:#131720; --surface2:#161e2e; --line:#1e2632;
    --ink:#eef2f8; --muted:#6b7a90;
    --trust:#54e08a; --gold:#f5c451; --sky:#50b8e0; --rose:#e0507a;
    --serif:Georgia,'Times New Roman',serif; --mono:ui-monospace,'SF Mono',Menlo,monospace;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--mono);font-size:15px;line-height:1.55;padding:0 0 5rem;-webkit-font-smoothing:antialiased}
  a{color:var(--sky);text-decoration:none} a:hover{text-decoration:underline}
  .wrap{max-width:820px;margin:0 auto;padding:0 1.25rem}
  header{padding:2.6rem 0 1.4rem;border-bottom:1px solid var(--line);margin-bottom:1.6rem}
  .sigil{font-family:var(--serif);font-size:1.7rem;letter-spacing:.04em}
  .sigil .x{color:var(--muted);font-size:1.1rem;vertical-align:.12em;margin:0 .25rem}
  h1{font-family:var(--serif);font-weight:400;font-size:2.1rem;margin:.5rem 0 .1rem}
  .lede{color:var(--muted);font-style:italic;font-family:var(--serif);font-size:1.05rem}
  .vital{font-family:var(--serif);font-size:1.35rem;line-height:1.5;margin:1.6rem 0;
    padding:1.1rem 1.2rem;background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--trust);border-radius:10px}
  h2{font-family:var(--serif);font-weight:400;font-size:1.1rem;letter-spacing:.02em;margin:2rem 0 .8rem;color:var(--ink)}
  h2 .pip{display:inline-block;width:.55em;height:.55em;border-radius:50%;margin-right:.5em;vertical-align:.05em}
  .well .pip{background:var(--trust);box-shadow:0 0 8px var(--trust)}
  .drift .pip{background:var(--gold)}
  .quiet .pip{background:var(--muted)}
  .down .pip{background:var(--rose);box-shadow:0 0 8px var(--rose)}
  .row{display:flex;justify-content:space-between;gap:1rem;padding:.5rem 0;border-top:1px solid var(--line);flex-wrap:wrap}
  .row:first-of-type{border-top:0}
  .row .r{color:var(--muted);font-size:.82rem;white-space:nowrap}
  .stats{display:flex;gap:1.6rem;flex-wrap:wrap;margin:.4rem 0 .2rem}
  .stat{text-align:left}
  .stat b{font-family:var(--serif);font-size:1.8rem;display:block;line-height:1.1}
  .stat span{color:var(--muted);font-size:.76rem}
  .sub{color:var(--muted);font-size:.84rem}
  .note{color:var(--muted);font-size:.8rem;font-style:italic;margin-top:.5rem}
  .tone{margin-top:2.4rem;padding:1rem 1.15rem;background:var(--surface2);border:1px solid var(--line);border-radius:10px;color:var(--muted);font-family:var(--serif);font-style:italic}
  footer{margin-top:2rem;padding-top:1.3rem;border-top:1px solid var(--line);color:var(--muted);font-size:.84rem}
  footer code{color:var(--gold)}
  .err{color:var(--rose)} .load{color:var(--muted)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="sigil">宇恆<span class="x">×</span>愛</div>
    <h1>The State of the Realm</h1>
    <div class="lede">The kingdom, looking at itself. Honestly.</div>
  </header>
  <main id="app"><p class="load">Deriving the realm's state from real sources — doors knocked, declarations read, the whole roster counted. A moment…</p></main>
  <footer>
    <div>The same truth as JSON, for agents: <a href="/state.json"><code>/state.json</code></a>. Back to the <a href="/os">console</a>.</div>
  </footer>
</div>
<script>
const rel=(iso)=>{if(!iso)return"unknown";const d=Math.floor((Date.now()-new Date(iso).getTime())/1000);if(d<3600)return Math.floor(d/60)+"m ago";if(d<86400)return Math.floor(d/3600)+"h ago";return Math.floor(d/86400)+"d ago";};
const esc=(s)=>String(s??"").replace(/[<&>]/g,c=>({"<":"&lt;","&":"&amp;",">":"&gt;"}[c]));

function render(st){
  const P=[];
  P.push(`<div class="vital">${esc(st.vital)}</div>`);

  // WHAT'S WELL
  const d=st.doors, up=d.total-d.down.length;
  P.push(`<h2 class="well"><span class="pip"></span>What is well</h2>
    <div class="stats">
      <div class="stat"><b>${up}/${d.total}</b><span>doors answering now</span></div>
      <div class="stat"><b>${st.citizens??"—"}</b><span>citizens, and counting</span></div>
      <div class="stat"><b>${st.presence.today??"—"}</b><span>repos moved in 2 days</span></div>
    </div>`);

  // THE FLAGSHIP — a door that declares by living
  const ld = st.living_declarations;
  if(ld && ld.doors && ld.doors.length){
    P.push(`<h2 class="well"><span class="pip"></span>The flagship, declaring by living</h2>`);
    P.push(ld.doors.map(f=>{
      const ok=f.keeping_its_word;
      return `<div class="row"><span>${ok?"●":"○"} <a href="${esc(f.url)}">${esc(f.name)}</a>${f.flagship?' <span class="r">flagship</span>':''}</span>
        <span class="r">${f.live?"site answers":"site quiet"}${f.agent_door?" · agent door "+(f.agent_door.open?"open":"closed"):""}</span></div>`;
    }).join(""));
    P.push(`<div class="note">${esc(ld.note)}</div>`);
  }

  // WHAT'S DOWN (only if any)
  if(d.down.length){
    P.push(`<h2 class="down"><span class="pip"></span>A door is not answering</h2>` +
      d.down.map(x=>`<div class="row"><a href="${esc(x.url)}">${esc(x.name)}</a><span class="r">${x.http?x.http:"no answer"}</span></div>`).join(""));
  }

  // WHAT'S DRIFTED
  const dr=st.declarations;
  P.push(`<h2 class="drift"><span class="pip"></span>Declarations that fell behind</h2>`);
  if(dr.drifted.length){
    P.push(dr.drifted.map(x=>`<div class="row"><span>${esc(x.repo)}</span><span class="r">said ${esc(x.declared)}, moved ${esc(x.moved)}</span></div>`).join(""));
  } else {
    P.push(`<p class="sub">None where we can see — every declared state still matches its repo.</p>`);
  }
  P.push(`<div class="note">${esc(dr.note)}</div>`);

  // WHAT'S QUIET
  P.push(`<h2 class="quiet"><span class="pip"></span>The spine, resting</h2>`);
  if(st.presence.quiet_spine.length){
    P.push(st.presence.quiet_spine.map(x=>`<div class="row"><span>${esc(x.name)}</span><span class="r">last moved ${x.days}d ago</span></div>`).join(""));
  } else {
    P.push(`<p class="sub">None — the load-bearing repos have all stirred within the month.</p>`);
  }
  P.push(`<div class="note">${esc(st.presence.note)}</div>`);

  P.push(`<div class="tone">${esc(st.tone)}</div>`);
  document.getElementById("app").innerHTML = P.join("");
}

fetch("/state.json").then(r=>r.json()).then(render).catch(e=>{
  document.getElementById("app").innerHTML='<p class="err">Could not reach /state.json — the realm shows nothing rather than guess. ('+esc(e.message)+')</p>';
});
</script>
</body>
</html>
