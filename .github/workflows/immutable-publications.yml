name: Immutable route integrity

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Deliberately no cancel-in-progress group: a later main push must never erase
# the only integrity result for an earlier release tree.

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out full publication history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install pinned Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.13

      - name: Resolve exact comparison base
        id: base
        shell: bash
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          base=""
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            base="$PR_BASE_SHA"
          elif [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            base="$PUSH_BEFORE_SHA"
          elif [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            base="$(git rev-parse "$GITHUB_SHA^1")"
          fi
          if [[ ! "$base" =~ ^[0-9a-f]{40}$ ]] || [[ "$base" =~ ^0+$ ]]; then
            printf 'exact nonzero base SHA is required for %s\n' "$GITHUB_EVENT_NAME" >&2
            exit 1
          fi
          printf 'sha=%s\n' "$base" >> "$GITHUB_OUTPUT"

      - name: Require the event base on the release first-parent chain
        shell: bash
        env:
          BASE_SHA: ${{ steps.base.outputs.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$BASE_SHA" != "$GITHUB_SHA"
          git rev-list --first-parent "$GITHUB_SHA" | grep -Fx "$BASE_SHA" >/dev/null

      - name: Verify snapshot and append-only history
        shell: bash
        env:
          BASE_SHA: ${{ steps.base.outputs.sha }}
        run: |
          set -euo pipefail
          bun bin/immutable-publications.ts --base "$BASE_SHA"

      - name: Exercise immutable staging gate
        run: bun test tests/immutable-publications.test.ts tests/stage-hub.test.ts tests/check-hub-live-retirement.test.ts
