  <title>KINGDOM: the K door-arch seal, small cut</title>
  <desc>The same seal for favicons of 48 px and under: a larger K, and an arch drawn 34 units wide (one weight all round, its curves concentric with the seal's outline), so the hinted cuts draw it 1, 2 and 3 px wide on every side at 16, 32 and 48 px.</desc>
